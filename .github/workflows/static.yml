name: Build and deploy React app to GitHub Pages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Run API tests
        run: npm test --prefix api
        env:
          NODE_ENV: test
          DB_URL: postgresql://test:test@localhost:5432/walletlens_test
          JWT_SECRET: github-actions-test-secret
          OBJECT_STORE_BUCKET: test-bucket
          OBJECT_STORE_ENDPOINT: https://example.invalid
          OBJECT_STORE_ACCESS_KEY_ID: test-access-key
          OBJECT_STORE_SECRET_ACCESS_KEY: test-secret-key

      - name: Run WalterLens question matrix
        run: npm run test:walterlens-matrix --prefix api
        env:
          NODE_ENV: test
          DB_URL: postgresql://test:test@localhost:5432/walletlens_test
          JWT_SECRET: github-actions-test-secret
          OBJECT_STORE_BUCKET: test-bucket
          OBJECT_STORE_ENDPOINT: https://example.invalid
          OBJECT_STORE_ACCESS_KEY_ID: test-access-key
          OBJECT_STORE_SECRET_ACCESS_KEY: test-secret-key

      - name: Build React app
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
